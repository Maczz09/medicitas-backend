events { worker_connections 1024; }

http {
  # Resolver de Docker (embebido) — sin esto, nginx resuelve el hostname del
  # upstream UNA SOLA VEZ al arrancar y cachea esa IP para siempre. Al
  # recrear/reiniciar el contenedor `backend` (cosa normal en desarrollo),
  # nginx queda apuntando a una IP muerta y responde 502 Bad Gateway hasta
  # que alguien reinicia nginx manualmente. `valid=10s` fuerza a re-resolver
  # periódicamente.
  resolver 127.0.0.11 valid=10s;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ─── Seguridad (Mitigación OWASP ZAP) ───
  server_tokens off; # Oculta la versión de Nginx (Soluciona 10036 y 10009)

  server {
    listen 80;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always; # Soluciona 10038
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always; # Soluciona 10063
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Inyección de correlationId si no viene
    add_header X-Correlation-Id $request_id always;

    # Healthcheck del propio gateway → proxeado al backend real
    location = /health {
      set $backend_upstream backend:3000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
    }

    location /api/ {
      set $backend_upstream backend:3000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_set_header Authorization $http_authorization;

      # Rate limiting básico
      limit_req zone=api burst=50 nodelay;
    }

    # Webhooks externos (Twilio, etc.) — sin rate limit
    location /webhooks/ {
      set $backend_upstream backend:3000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI
    location /api-docs/ {
      set $backend_upstream backend:3000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
    }
  }
}
