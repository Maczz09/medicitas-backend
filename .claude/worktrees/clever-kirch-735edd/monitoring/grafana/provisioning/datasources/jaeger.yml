apiVersion: 1

datasources:
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # Cruza un trace de Jaeger con sus logs en Loki usando el mismo correlationId
        tags: [{ key: 'correlationId', value: 'correlationId' }]
        filterByTraceID: false
        filterBySpanID: false
