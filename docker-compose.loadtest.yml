# Override para PRUEBAS DE CARGA. NO afecta el `docker compose up` normal.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
#
# Vuelta a producción (revierte todo lo de abajo):
#   docker compose up -d
#
# Qué activa (todo gateado por env, prod queda intacto):
#   - LOAD_TEST_MODE=true  → apaga el rate limiting (200/15min) del app.
#   - CLUSTER_MODE=true     → src/cluster.js hace fork de N workers (uno por
#                             core; WEB_CONCURRENCY para fijarlo). Los consumers
#                             y WhatsApp corren en UN solo worker.
#   - DB_POOL_SIZE=20       → pool de MySQL por worker (default prod: 10).
#   - USE_MOCK_SMS=true     → notificaciones por mock, sin levantar Chromium
#                             (libera CPU/RAM durante la carga).
#   - MySQL max_connections=500 → headroom para (workers × DB_POOL_SIZE).
#
# IMPORTANTE — right-sizing del pool (lección aprendida en la 1ª corrida):
# el cuello de botella NO es Node sino MySQL. Con 10 workers × 20 pool = 200
# conexiones, MySQL quedaba a 800% CPU con ~200 queries corriendo a la vez
# (thrashing) y el throughput COLAPSABA (la prueba de 500k se estancó en 141k).
# La regla: el TOTAL de conexiones (WEB_CONCURRENCY × DB_POOL_SIZE) debe rondar
# 3-4× los cores, no saturar. Menos workers Node dejan cores libres para MySQL.
# Defaults balanceados que funcionan en ambas máquinas (Ryzen 12t y laptop i5 8t):
#   6 workers × 8 pool = 48 conexiones. Se pueden subir/bajar por env si sobra CPU.
services:
  backend:
    environment:
      LOAD_TEST_MODE: "true"
      CLUSTER_MODE: "true"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-6}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-8}"
      USE_MOCK_SMS: "true"
      # Log de acceso HTTP: ENCENDIDO también en carga. LOAD_TEST_MODE=true lo
      # apagaba (ver httpLogger.middleware.js) para no inundar Loki a >1000
      # líneas/s, pero el efecto era que durante las pruebas k6 NO se veía ni
      # una petición en Grafana — justo la evidencia de observabilidad que se
      # necesita mostrar. A los ~350 req/s de la carga normal Loki lo sostiene
      # sin problema. Si haces una corrida de volumen extremo y Loki se retrasa:
      #   $env:LOG_HTTP="false"; docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
      LOG_HTTP: "${LOG_HTTP:-true}"
      # OpenTelemetry: ENCENDIDO por defecto también en carga, pero MUESTREADO
      # (10%): así Jaeger SIEMPRE muestra trazas de las pruebas en cualquier
      # máquina que clone el repo, sin tocar variables de entorno de la sesión.
      #
      # Historia: antes venía apagado por defecto porque SIN sampling exportaba
      # UN trace por request (>800/s) a Jaeger (memoria) y desbordaba WSL2. El
      # peligro era el 100%, no el tracing en sí: con parentbased_traceidratio
      # al 10% (~35 trazas/s a 350 req/s) es estable y las cascadas end-to-end
      # completas aparecen (la decisión de muestreo del request raíz se propaga
      # a los consumers vía traceparent del outbox).
      #
      # ¿Necesitas el MÁXIMO throughput para pasar un nivel? Apágalo explícito:
      #   $env:OTEL_SDK_DISABLED="true"; docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
      # (cuesta ~30% de throughput tenerlo encendido; ambos modos dan 0% 5xx).
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE:-0.10}"

  workers:
    environment:
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE:-0.10}"

  mysql:
    # El entrypoint oficial antepone `mysqld` cuando el command empieza con `-`.
    command: --max-connections=500

  prometheus:
    # Se repiten los flags base y se agrega el receiver de remote-write para que
    # k6 pueda empujar sus métricas y verlas en Grafana junto a las del app.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
