global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'medicitas-backend'
    # Puerto 9091 = servidor de métricas dedicado. En cluster el primary AGREGA
    # las métricas de todos los workers (backend:3000/metrics daría solo un
    # worker al azar). En modo normal es el registro local. Ver
    # src/config/metricsServer.js.
    static_configs:
      - targets: ['backend:9091']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'farmacia-api'
    static_configs:
      - targets: ['farmacia_api:4002']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'aseguradora-api'
    static_configs:
      - targets: ['aseguradora_prosalud_api:4001']
    metrics_path: /metrics
    scrape_interval: 10s
